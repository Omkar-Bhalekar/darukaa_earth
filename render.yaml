services:
  - type: web
    name: darukaa-earth-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    preDeployCommand: alembic upgrade head
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false          # managed manually in the Render dashboard
      - key: JWT_SECRET
        sync: false
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 30
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: 7
      - key: COOKIE_SECURE
        value: true
      - key: FRONTEND_URL
        value: https://darukaa-earth-frontend-dkmb.onrender.com

  - type: web
    name: darukaa-earth-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false
      - key: VITE_MAPBOX_TOKEN
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: darukaa-earth-db
    databaseName: darukaa_earth
    user: darukaa_earth_user
    plan: free
